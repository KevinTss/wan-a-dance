packages:
  - apps/*
  - packages/*

autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  lefthook: true
  unrs-resolver: true
  esbuild: true
  sharp: true
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  msw: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@swc/core': true
  '@parcel/watcher': false
