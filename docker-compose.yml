services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wad
      POSTGRES_PASSWORD: wad
      POSTGRES_DB: wad
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wad']
      interval: 2s
      timeout: 2s
      retries: 20
