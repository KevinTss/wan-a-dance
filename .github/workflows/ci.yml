name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TZ: UTC

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint
      - run: pnpm check:stories && pnpm check:agents && pnpm check:i18n
      - name: Domain docs in sync
        if: github.event_name == 'pull_request'
        run: pnpm check:docs
        env:
          DOCS_BASE_REF: origin/${{ github.base_ref }}
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
      - name: Changeset present
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - name: Story coverage (report)
        run: pnpm check:story-coverage >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: wad, POSTGRES_PASSWORD: wad, POSTGRES_DB: wad }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wad" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_PG_SERVER_URL: postgresql://wad:wad@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: 'packages/*/coverage', if-no-files-found: ignore }

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wad/storybook exec playwright install --with-deps chromium
      - run: pnpm turbo run test:storybook
      - run: pnpm --filter @wad/storybook build
      - uses: actions/upload-artifact@v4
        with: { name: storybook-static, path: apps/storybook/storybook-static }

  visual:
    needs: storybook
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: storybook-static, path: apps/storybook/storybook-static }
      - run: pnpm test:visual
        env: { HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: visual-report, path: apps/e2e/playwright-report-visual }

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: wad, POSTGRES_PASSWORD: wad, POSTGRES_DB: wad }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wad" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_PG_SERVER_URL: postgresql://wad:wad@localhost:5432/postgres
      DATABASE_URL: postgresql://wad:wad@localhost:5432/wad_e2e
      BETTER_AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET || 'ci-only-secret-ci-only-secret-0000000' }}
      BETTER_AUTH_URL: http://localhost:3200
      MAIL_ADAPTER: console
      PUBLIC_API_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wad/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@wad/web
      - run: pnpm --filter @wad/e2e prepare-db
      - run: pnpm --filter @wad/e2e exec playwright test --project='ui-*' --project=api --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/e2e/playwright-report

  release:
    needs: [quality, test, storybook, visual, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset tag
          title: Version packages
          commit: Version packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
