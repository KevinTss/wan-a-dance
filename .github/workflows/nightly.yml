name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: wad, POSTGRES_PASSWORD: wad, POSTGRES_DB: wad }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wad" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      NIGHTLY: 'true'
      TEST_PG_SERVER_URL: postgresql://wad:wad@localhost:5432/postgres
      DATABASE_URL: postgresql://wad:wad@localhost:5432/wad_e2e
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0000000
      BETTER_AUTH_URL: http://localhost:3200
      MAIL_ADAPTER: console
      PUBLIC_API_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wad/e2e exec playwright install --with-deps
      - run: pnpm turbo run build --filter=@wad/web
      - run: pnpm --filter @wad/e2e prepare-db
      - run: pnpm --filter @wad/e2e exec playwright test --project='ui-*'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-report, path: apps/e2e/playwright-report }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm audit --prod --audit-level=high
